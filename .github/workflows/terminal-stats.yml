name: Update Terminal Stats Card

on:
  schedule:
    - cron: "0 0 * * *"  # se actualiza todos los días a medianoche UTC
  workflow_dispatch: {}   # permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  build-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Generar la card de stats en formato terminal
        uses: yogeshwaran01/github-stats-terminal-style@master
        with:
          username: lusalvi
          theme: monokai
          headerStyle: mac
          commands: whoami,neofetch,languages,top-repos,uptime,exit
          outputPath: assets/github_stats.svg

      - name: Commitear y subir los cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github_stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar terminal stats card [skip ci]" && git push)