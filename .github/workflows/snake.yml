name: Generar snake del historial de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"  # se actualiza todos los días a las 5:00 UTC
  workflow_dispatch: {}   # permite ejecutarlo manualmente desde la pestaña Actions
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generar SVG de la snake
        uses: Platane/snk@v3
        with:
          github_user_name: lusalvi
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Subir el SVG a la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 